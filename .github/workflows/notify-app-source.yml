name: Notify App Source

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify website repository
        env:
          GH_TOKEN: ${{ secrets.APP_SOURCE_TOKEN }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/nxtcoreee3/nxtcoreee3/dispatches \
            -d '{"event_type":"app-release"}'
